name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -timeout=5m ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/kaze
      - name: Native macOS session shortcuts
        if: runner.os == 'macOS'
        run: sh tools/test-session-keys.sh
      - name: Race checks
        if: runner.os == 'macOS'
        run: go test -race -timeout=5m ./internal/sessionstate ./internal/tabs ./internal/term ./internal/subagents ./internal/screen ./internal/render ./internal/gitinfo ./internal/ui
      - name: Cross-build Windows ARM64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          go build -o kaze-arm64.exe ./cmd/kaze
